name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    name: Go server — vet + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: server/go.sum
      - name: go vet
        run: go vet ./...
      - name: build
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o /tmp/cap-server .
      - name: smoke run
        env:
          CAP_TOKEN: test-token
        run: |
          /tmp/cap-server &
          PID=$!
          sleep 1
          curl -sf http://localhost:8585/healthz | tee /dev/stderr
          kill $PID

  mcp:
    name: MCP server — install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mcp/package.json
      - run: npm install --silent
      - name: syntax check
        run: node --check src/index.js

  extension:
    name: Chrome extension — manifest lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v6
      - name: validate manifest.json
        run: |
          python3 -c "import json,sys; m=json.load(open('manifest.json')); assert m['manifest_version']==3, 'must be MV3'; print('manifest OK:', m['name'], 'v'+m['version'])"
      - name: syntax check JS
        run: |
          for f in *.js; do node --check "$f"; done
